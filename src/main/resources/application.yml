spring:
  application:
    name: insta-clone
  docker:
    compose:
      lifecycle-management: start-and-stop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Batches lazy collection loads (e.g. Conversation.participants) into one IN-query per
        # batch instead of one query per parent row — avoids N+1 without touching call sites.
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  rate-limit:
    auth:
      # See AuthRateLimitFilter — disabled in the integration tests that register many accounts
      # from the same host in one run.
      enabled: true
  jwt:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # Local dev runs over plain HTTP; flip to true once deployed behind Cloudflare/Let's Encrypt TLS (Phase 5).
    cookie-secure: false
  storage:
    endpoint: http://localhost:8333
    region: us-east-1
    access-key: local
    secret-key: local
    bucket: instaclone-media
    # Host only — StorageService appends the bucket itself so the signed and public URLs can't drift apart.
    public-base-url: http://localhost:8333
    auto-create-bucket: true
  stories:
    default-ttl: PT24H
    max-ttl: PT24H
  search:
    endpoint: http://localhost:7700
    api-key: local-dev-master-key
    users-index: users
    posts-index: posts
  cors:
    allowed-origins:
      - http://localhost:5173
  email:
    # Unset by default — EmailConfig falls back to logging the email instead of sending it (see
    # LoggingEmailService). Set RESEND_API_KEY to send real password-reset emails via Resend
    # (resend.com); RESEND_FROM_ADDRESS must be a verified sender/domain on that account.
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:onboarding@resend.dev}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Verbose on purpose for local testing: SQL + bound parameters, and Spring Security's own
# authorization decisions, on top of the request-in/request-out lines from RequestLoggingFilter.
# Never dial app-level logging below INFO in a shared/deployed environment — passwords never get
# logged (RequestLoggingFilter and the auth endpoints deliberately never log bodies), but this
# much detail isn't something you want in a shared environment's logs either.
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-        }]){yellow} %clr(---){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    com.instaclone: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
